packages:
  - .

# @parcel/watcher (via @coggit/runtime-node) needs its native build script
# allowed; it ships prebuilt binaries for common platforms.
allowBuilds:
  '@parcel/watcher': true

# @deepseek-ai/* are host-provided peers (see peerDependencies). The host's
# prerelease line cannot be resolved from the registry (cross-referenced ^0.1.2
# ranges are unsatisfiable by prerelease versions), so peer auto-install must
# stay off; development resolution goes through the machine-local junction
# built by scripts/relink-dsh-peers.mjs.
autoInstallPeers: false

minimumReleaseAgeExclude:
  - '@catheadowl/dsh-eval@0.1.0'
  - '@coggit/core@0.2.0'
  - '@coggit/runtime-node@0.2.0'

# Standing local-resolution channel for `@coggit/core`: the adapter
# co-develops against the monorepo checkout (core changes land here before
# any registry release). Install-time only — overrides never enter the
# packed tarball (`pnpm publish` ships the `^0.2.0` manifest untouched), so
# no add/remove switch ritual is needed around releases. A clean-registry
# verification pass (comment out, reinstall, `pnpm --dir . verify`) is the
# only reason to ever disable this.
overrides:
  '@coggit/core': 'link:../../packages/core'
